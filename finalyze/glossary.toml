# What every figure, label and concept of the app means: the source of the web
# app's tooltips and its Glossary page (GET /api/glossary), written to also
# serve as a primer for assistants.
#
# Each entry is a table under `term`, keyed by a stable key (the web app's
# <Term key="...">), in the order of the Glossary page, with:
# - title: its name on the Glossary page
# - section: the page's heading it is under
# - labels: the labels as shown (placeholders: N, <month>, <date>, <tag>)
# - short: the tooltip, one or two sentences
# - computed: how it is computed (what is included and left out), in Markdown
#   (paragraphs, "- " lists, **bold**, `code`, and [text](#key) links to
#   other entries)
# - related: keys of related entries
#
# Unless an entry says otherwise, a dashboard figure is subject to the shared
# scope of the "Scope of the dashboard" section: the accounts chosen, the
# groups under "flows of", "Only these tags", the period, and complete months.

# Scope of the dashboard

[term.period]
title = "Period"
section = "Scope of the dashboard"
labels = ["3M", "6M", "12M", "24M", "YTD", "All", "‹ <month> – <month> · N mo ›"]
short = "The months shown: the last 3, 6, 12 or 24, the year to date, or all of them. The arrows move the period by its own length."
computed = """
Presets count back from the **last month offered**: the last month with transactions (in the chosen accounts), without the current month when [complete months only](#complete_months_only) is on. YTD starts in January of that month's year, and All at the first month with transactions. Both end months are included.

The arrows (and the `,` and `.` keys) turn the preset into explicit months (shown in the accent color), moved by the period's length, and stop at the first and last month offered. Choosing a preset returns to the latest months. Explicit months may include the current month even with complete months only.

Every month of the period is shown, also months without rows (their sums are 0).
"""
related = ["complete_months_only", "as_of"]

[term.complete_months_only]
title = "Complete months only"
section = "Scope of the dashboard"
labels = ["complete months only"]
short = "Leaves the current calendar month, which is incomplete, out of monthly figures. Balances still run to the latest data."
computed = """
On (the default), the months offered for monthly figures (cash flows, breakdowns, trends, averages, the month cards) stop at the month before today's. Months chosen explicitly with the period's arrows are kept as chosen.

Balances, the balance cards, the bridge's "then" line and the Ledger run to the latest data either way, unless the period ends earlier: see [as of](#as_of).

The default is set in Settings › Dashboard defaults.
"""
related = ["period", "as_of"]

[term.as_of]
title = "As of (the balances' date)"
section = "Scope of the dashboard"
labels = ["as of <date>", "Balances · as of <date>", "balances as of <date>"]
short = "The date balances are at: the latest transaction's, or the last one in the period if the period ends before the last month offered."
computed = """
Balances (the cards, the Balance view, the Ledger's running balances) include every row up to the end of that day, of every kind and group in the chosen accounts.

When the period ends at the last month offered, they run past it to the latest data, so they can be later than the month cards' month (e.g. balances as of 22 Oct with Sep as the last complete month).
"""
related = ["available", "net_worth", "complete_months_only"]

[term.accounts_filter]
title = "Accounts"
section = "Scope of the dashboard"
labels = ["account chips", "accounts"]
short = "Only these accounts, as if the others didn't exist. None chosen means all of them."
computed = """
The chosen accounts' rows are kept before anything else is computed, so balances, the net worth, the period's months and the Ledger are theirs only. A chip marked `hold` is an account in a [holding](#role_holding) group.
"""
related = ["flows_of", "group"]

[term.flows_of]
title = "Flows of"
section = "Scope of the dashboard"
labels = ["flows of"]
short = "Which groups' accounts count in cash flows, breakdowns, trends and averages. By default, the spending groups."
computed = """
Incomes, expenses, kept, set aside, breakdowns, trends, movers, averages and the runway's expenses use only the accounts of these groups. Balances, the bridge, the data checks and the Ledger always have every group.

[Set aside](#set_aside) counts only the saving rows of **spending** groups among them, so adding a holding group (the other side of a saving) doesn't cancel it out.

The last group can't be left out: flows need one. `e` toggles every group.
"""
related = ["group", "role_spending", "role_holding", "set_aside"]

[term.dashboard_controls]
title = "The dashboard's controls"
section = "Scope of the dashboard"
labels = ["When", "Which money", "How to compute"]
short = "The dashboard's options, grouped by what they do. A group's label lights up, with a dot, while any of its options isn't the default."
computed = """
- When: the [period](#period), a preset or explicit months, on the first line.
- Which money: the [accounts](#accounts_filter), the groups whose [flows](#flows_of) count, and [only these tags](#only_these_tags).
- How to compute: the [average](#average_of)'s window, [one-offs in averages](#one_offs_in_averages), [net by tag](#net_by_tag), [complete months only](#complete_months_only) and the [Monthly view's months](#monthly_view_months). An option that isn't the default (Settings' Dashboard defaults) is in the accent color, and [reset](#reset_defaults) sets them all back.

The label's tooltip lists what isn't the default. Every option is in the page's URL, and the keys are as before (`?` lists them).
"""
related = ["period", "accounts_filter", "flows_of", "only_these_tags", "reset_defaults"]

[term.only_these_tags]
title = "Only these tags"
section = "Scope of the dashboard"
labels = ["Only these tags", "tags: all", "tags: <tag>, <tag>", "N tags", "only <tag>, <tag>"]
short = "Only these tags in cash flows, breakdowns, trends, averages and Set aside. Balances and the Ledger have every tag."
computed = """
Applies to every figure of incomes, expenses and money set aside, and to the runway's expenses. It doesn't apply to balances, the bridge, the data checks or the Ledger. Untagged rows are left out while it is set.
"""
related = ["flows_of", "untagged"]

[term.one_offs_in_averages]
title = "One-offs in averages"
section = "Scope of the dashboard"
labels = ["one-offs in averages", "excl. one-offs", "incl. one-offs"]
short = "Whether one-offs also count in averages, trends and comparisons. They are always in monthly sums, breakdown totals and balances."
computed = """
Off (the default, `excl. one-offs`): averages, rolling averages, baselines, trends, movers, the Avg/mo card and the income check count only [regular](#regular) tags. On (`incl. one-offs`, key `O`): regular and [one-off](#one_off) tags.

Monthly sums (the month cards' amounts, Cash flow's bars and table, Breakdown's totals and months, Monthly's cells, the period's totals and rates) always include one-offs. The [runway](#runway) always leaves them out.
"""
related = ["one_off", "regular", "rolling_average", "baseline"]

[term.net_by_tag]
title = "Net by tag"
section = "Scope of the dashboard"
labels = ["net by tag"]
short = "Counts each tag as income or expense by its total, so a refund lowers the tag's expenses instead of adding an income."
computed = """
On: a tag's rows are summed over **all the data** (in the chosen accounts and the groups of the figure, of the figure's kinds). A positive sum makes all its rows incomes, a sum of 0 or less makes them expenses (so a refund is a negative expense). [Untagged](#untagged) rows go by their own sign. The classification is the same in every period, so a tag may show as a negative expense in a period where it was refunded more than it spent.

Off: each row goes by its own sign (positive: income, negative: expense).

Net ([kept](#kept)) is the same either way. Set in Settings › Dashboard defaults, toggled with `n`.
"""
related = ["incomes", "expenses", "sign_flip"]

[term.average_of]
title = "Average of"
section = "Scope of the dashboard"
labels = ["average of", "previous month", "3 months", "6 months", "12 months"]
short = "The rolling average shown, and what months are compared with: the plain average of the last 1, 3, 6 or 12 months."
computed = """
Chooses the window of every [rolling average](#rolling_average) and [baseline](#baseline) on the dashboard, and of the [runway](#runway). Every window is computed in one response, so switching doesn't reload. With "previous month", a month is compared with the month before, and Cash flow doesn't draw rolling lines (they would equal the bars).

The default (6 months) is set in Settings, and `w` / `W` step through the windows.
"""
related = ["rolling_average", "baseline"]

[term.rolling_average]
title = "Rolling average"
section = "Scope of the dashboard"
labels = ["N-mo avg", "N-mo avg through <month>", "Net, N-mo avg through"]
short = "The plain average of the last N calendar months, up to and including the month."
computed = """
The sum of the last N calendar months divided by N, with 0 for months without rows. It uses the months before the period too, and is empty until the data has N months. Of [averaged kinds](#one_offs_in_averages): without one-offs unless they are included.

Not the same as a [baseline](#baseline), which ends the month before.
"""
related = ["baseline", "average_of", "one_offs_in_averages"]

[term.baseline]
title = "Baseline (vs N-mo avg)"
section = "Scope of the dashboard"
labels = ["vs N-mo avg", "N-mo avg before", "vs previous month", "▲▼ vs N-mo avg"]
short = "What a month is compared with: the rolling average of the N months before it, without the month itself."
computed = """
The [rolling average](#rolling_average) ending the month before. With "previous month", it is that month's amount. Both the month and its baseline are of [averaged kinds](#one_offs_in_averages), so when one-offs are left out, the compared amount isn't the monthly sum shown (the cards then show it as "X excl. one-offs").

The change is (month − baseline) / |baseline|, blank without a baseline (or with a baseline of 0).
"""
related = ["rolling_average", "change_percent", "average_of"]

[term.change_percent]
title = "Change from the baseline (▲▼ %)"
section = "Scope of the dashboard"
labels = ["▲ N%", "▼ N%", "0%"]
short = "The change from the baseline, in percent. Red when it's bad news (more spent, less earned), green when good."
computed = """
(month − [baseline](#baseline)) / |baseline| × 100, rounded. A change that rounds to 0% has no arrow. Both are of averaged kinds (without one-offs unless included).

Colors start at: any change on the month cards and Monthly's totals, ±5% in Top expenses and Cash flow's table, ±10% in Trends. Monthly's arrows show from 10%.
"""
related = ["baseline", "movers"]

[term.monthly_view_months]
title = "Monthly view months"
section = "Scope of the dashboard"
labels = ["Monthly view N mo", "months − N +"]
short = "How many of the period's last months the Monthly view shows side by side."
computed = """
Up to 36, and never more than the period has. The default is set in Settings, and `+` / `-` step it in the Monthly view.
"""
related = ["monthly_table"]

[term.reset_defaults]
title = "Reset to the defaults"
section = "Scope of the dashboard"
labels = ["reset"]
short = "Sets the options of How to compute back to their defaults: the rolling average, one-offs in averages, netting, complete months only and the Monthly view's months."
computed = """
The defaults are Settings' (Dashboard defaults: the defaults… link beside it goes there), and one-offs are left out of averages. It shows while any of them isn't the default, and doesn't reset the period, the accounts, the groups or the tags.
"""
related = ["dashboard_controls", "net_by_tag", "one_offs_in_averages", "monthly_view_months", "complete_months_only", "average_of"]

# Kinds and groups

[term.kind]
title = "Kind"
section = "Kinds and groups"
labels = ["Kind", "kind"]
short = "What a tag's transactions are: regular, one-off, saving, transfer or reconciliation. It decides where they count."
computed = """
Set on a tag (Tags page). A subtag has its tag's kind unless it has its [own](#own). One transaction can also have a [kind set on it](#kind_set), over its tag's. Untagged rows (and unknown tags) are regular.

- [regular](#regular) and [one-off](#one_off): incomes and expenses
- [saving](#saving): money set aside
- [transfer](#transfer): neither, only in balances, with both sides recorded
- [reconciliation](#reconciliation): neither, only in balances, with no other side (e.g. an opening balance)
"""
related = ["regular", "one_off", "saving", "transfer", "reconciliation", "own", "kind_set"]

[term.regular]
title = "Regular"
section = "Kinds and groups"
labels = ["regular"]
short = "Ordinary incomes and expenses: in monthly sums, averages, trends and comparisons."
computed = """
The default kind, also of untagged rows. Regular rows are the only ones in averages, trends and baselines while [one-offs](#one_offs_in_averages) are left out.
"""
related = ["kind", "one_off"]

[term.one_off]
title = "One-off"
section = "Kinds and groups"
labels = ["one-off", "◆", "one-offs hatched"]
short = "A real but unusual income or expense (e.g. a wedding, a car sale). It's in monthly sums and balances, but left out of averages and comparisons unless included."
computed = """
Rows whose effective kind is `one-off`: of a one-off tag, a subtag whose [own](#own) kind is one-off, or a transaction [set as one](#kind_set). They count in monthly sums, breakdown totals, the period's totals and balances. They are left out of averages, rolling averages, baselines, trends and movers unless [one-offs in averages](#one_offs_in_averages) is on, and always out of the [runway](#runway).

◆ marks an amount that contains a one-off part, and hatching marks the one-off part of a bar. The hatched part is drawn within the bar (a refunded one-off only lowers the total).
"""
related = ["kind", "one_offs_in_averages", "regular", "kind_set"]

[term.saving]
title = "Saving"
section = "Kinds and groups"
labels = ["saving"]
short = "Money moved out to be kept: shown as Set aside, never as an expense."
computed = """
Rows of saving tags are neither incomes nor expenses. Those of spending accounts make up [Set aside](#set_aside). Usually both sides are recorded (out of checking, into a savings account), and they cancel out in the net worth.
"""
related = ["set_aside", "kind", "transfer"]

[term.transfer]
title = "Transfer"
section = "Kinds and groups"
labels = ["transfer", "± transfers"]
short = "Money moving between own accounts (e.g. a card payment). Never an income or expense, only in balances."
computed = """
Rows of transfer tags count only in balances, the bridge's transfers term and the Ledger. When both sides of every transfer are recorded, they add up to 0 over every group (see [transfers off](#transfer_residual)). A row with no other side, such as an opening balance, is a [reconciliation](#reconciliation).
"""
related = ["kind", "transfer_residual", "bridge", "reconciliation"]

[term.reconciliation]
title = "Reconciliation"
section = "Kinds and groups"
labels = ["reconciliation", "+ reconciliations"]
short = "A row that re-anchors a balance, e.g. an opening balance, or a wallet counted short of its rows. Only in balances."
computed = """
Rows of reconciliation tags count in balances (of their account and source, group, the net worth and available), the bridge's reconciliations term and the Ledger. They are never incomes or expenses, so they are out of cash flows, averages, trends and breakdowns, and they aren't [transfers](#transfer), so they never show as [transfers off](#transfer_residual).

To re-anchor a balance on a date, add a row of the counted amount less the [balance on that date](#balance_on_date), tagged with a reconciliation tag.
"""
related = ["kind", "transfer", "bridge", "balance_on_date"]

[term.untagged]
title = "Untagged"
section = "Kinds and groups"
labels = ["untagged"]
short = "A transaction without a tag, neither by a rule nor by an annotation. It counts as regular."
computed = """
Untagged rows are regular incomes or expenses, by their own sign even when [netting by tag](#net_by_tag). They are left out while [Only these tags](#only_these_tags) is set. The Annotate page's first queue lists them.
"""
related = ["queue", "regular", "rule", "annotation"]

[term.split]
title = "Split"
section = "Kinds and groups"
labels = ["split", "part", "parts"]
short = "A transaction divided into parts, each with its own tag and amount."
computed = """
An [annotation](#annotation) can have several parts, which sum to the transaction's amount. On the dashboard each part is a row of its own, with its own kind, so one transaction can be partly an expense and partly a saving.
"""
related = ["annotation"]

[term.group]
title = "Group"
section = "Kinds and groups"
labels = ["Group", "group", "groups"]
short = "A set of accounts with a role: spending (day-to-day money) or holding (savings, investments, debt)."
computed = """
Every account is in one group (accounts not set up yet are in the default spending group). The role decides where the accounts count:

- [spending](#role_spending): cash flows (by default) and the available balance
- [holding](#role_holding): only the net worth (unless added under [flows of](#flows_of))

Groups are edited on the Accounts page.
"""
related = ["role_spending", "role_holding", "flows_of", "account"]

[term.role_spending]
title = "Spending (role)"
section = "Kinds and groups"
labels = ["spending", "spending groups"]
short = "Day-to-day money: its accounts are in cash flows, breakdowns and the available balance."
computed = """
Groups with the spending role make up the [available](#available) balance, the default [flows of](#flows_of), and the only side [Set aside](#set_aside) is measured on.
"""
related = ["group", "role_holding", "available"]

[term.role_holding]
title = "Holding (role)"
section = "Kinds and groups"
labels = ["holding", "hold"]
short = "Savings, investments or debts: only in the net worth, not in cash flows or the available balance."
computed = """
Accounts of holding groups count in the [net worth](#net_worth) at their recorded balance (what went in and out, not a market value). They are left out of cash flows unless their group is added under [flows of](#flows_of). A positive balance is owned (or owed to the household).
"""
related = ["group", "role_spending", "net_worth"]

[term.account]
title = "Account and source"
section = "Kinds and groups"
labels = ["Account", "Source", "account/source"]
short = "An account is a bank account (or the like). A source is a kind of file within it, e.g. its card, shown as account/source."
computed = """
Transactions come from the raw files of each account: the files in its folder of the [raw folder](#raw_folder). A file can hold several sources (e.g. the checking account and a credit card). Balances are kept per account and source, and summed into groups.

A card source's balance is usually negative (charges not yet paid), and is part of the available balance.
"""
related = ["group", "available", "raw_folder"]

# Incomes and expenses

[term.incomes]
title = "Incomes"
section = "Incomes and expenses"
labels = ["Incomes", "incomes", "earned", "+ incomes"]
short = "Money that came in: positive rows of regular and one-off tags (or tags that are net incomes, when netting by tag)."
computed = """
Rows of [regular](#regular) and [one-off](#one_off) tags, in the accounts of [flows of](#flows_of) and [only these tags](#only_these_tags), that are incomes: positive ones, or every row of a tag whose total is positive when [netting by tag](#net_by_tag). Savings and transfers are never incomes.

Monthly sums include one-offs. Averages and comparisons don't, unless included.
"""
related = ["expenses", "kept", "net_by_tag"]

[term.expenses]
title = "Expenses"
section = "Incomes and expenses"
labels = ["Expenses", "expenses", "spent", "− expenses"]
short = "Money spent: negative rows of regular and one-off tags (or tags that are net expenses, when netting by tag), shown as positive amounts."
computed = """
Rows of [regular](#regular) and [one-off](#one_off) tags, in the accounts of [flows of](#flows_of) and [only these tags](#only_these_tags), that are expenses: negative ones, or every row of a tag whose total is 0 or less when [netting by tag](#net_by_tag) (then a refund lowers its expenses, and a tag can be negative in a month). Savings and transfers are never expenses.

Monthly sums include one-offs. Averages and comparisons don't, unless included.
"""
related = ["incomes", "kept", "net_by_tag"]

[term.kept]
title = "Kept (net)"
section = "Incomes and expenses"
labels = ["Kept", "Net (kept)", "Net", "Kept %", "kept"]
short = "Incomes less expenses (the net), before money set aside. Kept % is its share of incomes."
computed = """
The signed sum of regular and one-off rows in the flow scope: [incomes](#incomes) − [expenses](#expenses). Savings and transfers aren't in it. It is the same whether or not netting by tag.

Kept % = kept / incomes, blank ("–") when incomes are 0 or less. It can be negative, or over 100% with negative expenses.
"""
related = ["incomes", "expenses", "set_aside"]

[term.set_aside]
title = "Set aside"
section = "Incomes and expenses"
labels = ["Set aside", "Set aside %", "set aside", "− set aside"]
short = "Money moved out under saving tags from spending accounts. It measures what was tagged as saving, not money simply left unspent."
computed = """
−(sum of [saving](#saving) rows) in the accounts of spending groups among [flows of](#flows_of) (and [only these tags](#only_these_tags)): positive when money went out to savings, lowered by withdrawals. Only the spending side counts, so a saving's other side in a holding account doesn't cancel it.

Set aside % = set aside / incomes (one-offs included), blank when incomes are 0 or less. When nothing in the period is tagged as saving it is 0, and the cards say so.
"""
related = ["saving", "kept", "nothing_tagged_as_saving"]

[term.nothing_tagged_as_saving]
title = "Nothing tagged as saving"
section = "Incomes and expenses"
labels = ["nothing tagged as saving", "nothing tagged as saving in N mo"]
short = "No row in the period has a saving tag: Set aside is 0 because nothing is tagged, not necessarily because nothing was saved."
computed = """
Counts the saving rows of the spending groups in the period's months, whatever [only these tags](#only_these_tags) says. Tag the moves to savings with a [saving](#saving) tag to see them.
"""
related = ["set_aside", "saving", "data_checks"]

# Cards

[term.available]
title = "Available"
section = "Cards"
labels = ["Available", "available"]
short = "Money in the spending groups' accounts, as of the balances' date. Card charges already recorded lower it."
computed = """
The sum of the balances of every account and source in [spending](#role_spending) groups, with every row up to the [as-of date](#as_of) (all kinds). Card sources are usually negative, so their recorded charges are already taken. Unaffected by flows of, tags and one-offs.

The line below is its change since the period's first day (since the first data for All).
"""
related = ["net_worth", "runway", "balance_change", "role_spending"]

[term.net_worth]
title = "Net worth"
section = "Cards"
labels = ["Net worth", "net worth"]
short = "Every account's balance added up, in every group, as of the balances' date."
computed = """
The sum of the balances of every account and source (spending and holding groups), with every row up to the [as-of date](#as_of). Holdings are at their recorded value (what went in and out), not market value.

The line below is its change since the period's first day, and the one-offs in that change.
"""
related = ["available", "balance_change", "role_holding"]

[term.balance_change]
title = "Change since the period's start"
section = "Cards"
labels = ["since <date>", "Change in period", "incl. N one-offs"]
short = "How much the balance moved from the period's first day to the balances' date."
computed = """
The balance as of the [as-of date](#as_of) minus the balance before the period's first day. For All, since the first data (the balance itself). Includes every kind (transfers and savings too), so it isn't the net.

"incl. N one-offs" on Net worth is the sum of the one-off rows of every group in that span.
"""
related = ["available", "net_worth", "bridge"]

[term.runway]
title = "Runway"
section = "Cards"
labels = ["Runway", "N mo runway", "of N/mo spent"]
short = "How many months of typical expenses the available balance covers."
computed = """
[Available](#available) ÷ the [rolling average](#rolling_average) of expenses through the period's last month, of the window chosen under [average of](#average_of). The expenses are always **without one-offs** (whatever one-offs in averages says), in the flow scope ([flows of](#flows_of), [only these tags](#only_these_tags)). Blank when those expenses are 0 or less.

Card balances are already in the available balance, so their charges aren't taken again.
"""
related = ["available", "rolling_average", "expenses"]

[term.month_cards]
title = "The month's cards"
section = "Cards"
labels = ["<month> · ▲▼ vs N-mo avg, excl. one-offs"]
short = "The period's last month: incomes, expenses, kept and set aside, each compared with the baseline."
computed = """
The amounts are the month's sums, one-offs included. The ▲▼ compare the month with its [baseline](#baseline), both of averaged kinds (without one-offs unless included). With complete months only, it's the last complete month.
"""
related = ["incomes", "expenses", "kept", "set_aside", "baseline"]

[term.compared_amount]
title = "Compared amount (excl. one-offs)"
section = "Cards"
labels = ["N excl. one-offs", "N excl. ·", "incl. N one-off"]
short = "The month's amount as it is compared: without its one-offs (unless included), or the one-off part it includes."
computed = """
When the month has one-offs and they are left out of comparisons, "N excl. one-offs" is the amount the ▲▼ compares with the [baseline](#baseline). With one-offs included, "incl. N one-off" is the one-off part of the amount shown.
"""
related = ["one_off", "baseline", "one_offs_in_averages"]

[term.period_rates]
title = "The period's sums and rates"
section = "Cards"
labels = ["N mo: <amount> · N%", "of incomes"]
short = "The same figure over the whole period, and its share of the period's incomes."
computed = """
Sums over every month of the period, one-offs included: Σ kept / Σ incomes, or Σ set aside / Σ incomes. Blank when the period's incomes are 0 or less.
"""
related = ["kept", "set_aside"]

[term.avg_per_month]
title = "Avg/mo"
section = "Cards"
labels = ["Avg/mo", "net", "spent", "earned", "avg/mo, N mo"]
short = "The period's average month: the net (kept), and below it what was spent and earned, without one-offs unless included."
computed = """
Σ over the period's months, of averaged kinds, ÷ the number of months (months without rows count as 0). Independent of the rolling window. Without one-offs unless [one-offs in averages](#one_offs_in_averages) is on.
"""
related = ["kept", "one_offs_in_averages", "rolling_average"]

[term.top_expenses]
title = "Top expenses"
section = "Cards"
labels = ["Top expenses · <month>"]
short = "The month's five expense tags that moved most from their baseline (movers), or the five largest."
