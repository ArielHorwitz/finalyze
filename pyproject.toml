[project]
name = "finalyze"
version = "0.1.0"
description = "Personal financial analysis tool"
requires-python = ">=3.13"
dependencies = [
    "polars==1.25.2",
    "pandas==2.2.3",
    "lxml==5.3.0",
    "pyarrow==18.0.0",
    "pydantic==2.10.4",
    "pydantic_extra_types==2.10.1",
    "pendulum==3.0.0",
    "toml==0.10.2",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]

[project.scripts]
finalyze = "finalyze.run:main"

[build-system]
requires = ["flit_core>=3.10.1"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # Used by finalyze.config (production code), not by tests
    "ignore:The `Color` class is deprecated:DeprecationWarning",
    # Starlette prefers httpx2 for its TestClient, httpx still works
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "UP007",  # keep `Optional[T]` rather than `T | None`
    "UP045",  # keep `Optional[T]` rather than `T | None`
]

[tool.ruff.lint.per-file-ignores]
# Its curl examples are copied whole, so they stay on one line
"finalyze/agent_md.py" = ["E501"]
